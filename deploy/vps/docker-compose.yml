# Optie 3: kobosync op een gehuurde server (VPS) met Caddy voor HTTPS.
# Stappenplan: zie README.md in deze map.
services:
  kobosync:
    build: ../..
    container_name: kobosync
    restart: unless-stopped
    # Geen "ports": kobosync is alleen via Caddy bereikbaar.
    volumes:
      - ${LIBRARY_DIR:-./library}:/library
      - ${DATA_DIR:-./data}:/data
    environment:
      KOBOSYNC_TOKEN: ${KOBOSYNC_TOKEN:?Zet KOBOSYNC_TOKEN in .env}
      KOBOSYNC_PUBLIC_URL: https://${DOMAIN:?Zet DOMAIN in .env}
      KOBOSYNC_PROXY_STORE: "true"
      # Verbeteringen aan je boeken; zet in .env op "false" om uit te zetten.
      KOBOSYNC_SPLIT_AUTHORS: ${KOBOSYNC_SPLIT_AUTHORS:-true}
      KOBOSYNC_FOLDER_COLLECTIONS: ${KOBOSYNC_FOLDER_COLLECTIONS:-true}
      KOBOSYNC_FIX_STYLES: ${KOBOSYNC_FIX_STYLES:-true}
      KOBOSYNC_MOVE_FRONT_MATTER: ${KOBOSYNC_MOVE_FRONT_MATTER:-true}
      KOBOSYNC_HYPHENATE: ${KOBOSYNC_HYPHENATE:-true}
      KOBOSYNC_OPEN_AT_TEXT: ${KOBOSYNC_OPEN_AT_TEXT:-true}
      KOBOSYNC_UPLOAD_PASSWORD: ${KOBOSYNC_UPLOAD_PASSWORD:-}
      KOBOSYNC_UPLOAD_MAX_MB: ${KOBOSYNC_UPLOAD_MAX_MB:-200}
      KOBOSYNC_READING_GOAL: ${KOBOSYNC_READING_GOAL:-0}
      KOBOSYNC_TIMEZONE: ${KOBOSYNC_TIMEZONE:-Europe/Amsterdam}

  caddy:
    image: caddy:2.8
    container_name: kobosync-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - kobosync

volumes:
  caddy_data:
  caddy_config:
